<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240"
     role="img" aria-label="Christian Oliveira — Designer &amp; Full Stack Developer">
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#C7BB98" stroke-width="0.5" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Fundo papel + grade -->
  <rect width="1000" height="240" fill="#E4DCC5"/>
  <rect width="1000" height="240" fill="url(#grid)"/>

  <!-- Faixas índigo topo/base -->
  <rect width="1000" height="6" fill="#1D2E4A"/>
  <rect y="234" width="1000" height="6" fill="#1D2E4A"/>

  <!-- Kanji 蜂 (abelha) -->
  <text x="68" y="162" font-family="Georgia, 'Times New Roman', serif"
        font-size="120" font-weight="700" fill="#2C4268">蜂</text>
  <text x="86" y="198" font-family="Georgia, serif"
        font-size="11" fill="#4A4740" letter-spacing="3">HACHI ・ 蜂</text>

  <!-- Divisor vertical -->
  <line x1="240" y1="58" x2="240" y2="182" stroke="#2C4268" stroke-width="1" opacity="0.8"/>

  <!-- Nome e papel -->
  <text x="272" y="118" font-family="Georgia, 'Times New Roman', serif"
        font-size="48" font-weight="700" fill="#1A1A1D">Christian Oliveira</text>
  <text x="276" y="154" font-family="Georgia, serif"
        font-size="14" fill="#4A4740" letter-spacing="4">DESIGNER &amp; FULL STACK DEVELOPER</text>

  <!-- Cantos -->
  <g stroke="#2C4268" stroke-width="1" fill="none" opacity="0.7">
    <path d="M 940 44 L 960 44 L 960 64"/>
    <path d="M 940 196 L 960 196 L 960 176"/>
  </g>

  <!-- Três pontinhos (motivo abelha) -->
  <g transform="translate(888,30)" fill="#2C4268">
    <circle cx="0" cy="0" r="2"/>
    <circle cx="12" cy="0" r="2"/>
    <circle cx="24" cy="0" r="2"/>
  </g>
</svg>
